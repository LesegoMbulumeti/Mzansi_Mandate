services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mandate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mandate_local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mandate}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandate"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mandate}:${POSTGRES_PASSWORD:-mandate_local_dev_password}@db:5432/${POSTGRES_DB:-mandate}
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
  agent:
    build: ./backend
    command: ["uvicorn", "app.agent.main:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      MANDATE_API_URL: http://api:8000
      AGENT_API_KEY: ${AGENT_API_KEY:-local-agent-change-me}
    depends_on:
      - api
    ports: ["127.0.0.1:8100:8100"]
  web:
    build: ./frontend
    environment:
      MANDATE_API_URL: http://api:8000
      MANDATE_ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in src/.env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in src/.env}
    depends_on:
      - api
    ports: ["3000:3000"]
  n8n:
    image: n8nio/n8n
    ports: ["5678:5678"]
    environment:
      WEBHOOK_URL: http://localhost:5678/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "false"
    volumes:
      - ./n8n/data:/home/node/.n8n
    depends_on:
      - agent

volumes:
  pgdata:
